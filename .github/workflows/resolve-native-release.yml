# Build resolve-native Conform Sidekick packages (script + installer per OS).
# Publishes ZIP artifacts; attaches them to GitHub Releases when a v* tag is pushed.

name: Resolve Native Release

on:
  push:
    branches:
      - resolve-native
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            archive: ConformSidekick-Windows
          - os: macos-14
            label: macos
            archive: ConformSidekick-macOS

    steps:
      - uses: actions/checkout@v4

      - name: Assemble install package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $pkg = $env:ARCHIVE
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "ResolveScript/Conform Sidekick.py" $pkg/
          Copy-Item "ResolveScript/conform_sidekick" $pkg/ -Recurse
          Get-ChildItem $pkg/conform_sidekick -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Copy-Item "installer/Install-ConformSidekick.ps1" $pkg/
          Copy-Item "installer/Install-ConformSidekick.bat" $pkg/
          Copy-Item "installer/Find-ResolvePython.ps1" $pkg/
          Copy-Item "installer/requirements-resolve.txt" $pkg/
          Copy-Item "installer/README.md" $pkg/INSTALL.txt
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip" -Force

      - name: Assemble install package (macOS)
        if: runner.os == 'macOS'
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          pkg="$ARCHIVE"
          mkdir -p "$pkg"
          cp "ResolveScript/Conform Sidekick.py" "$pkg/"
          cp -R "ResolveScript/conform_sidekick" "$pkg/"
          find "$pkg/conform_sidekick" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          cp installer/install_conform_sidekick.sh "$pkg/"
          cp installer/find_resolve_python.sh "$pkg/"
          cp installer/requirements-resolve.txt "$pkg/"
          chmod +x "$pkg/install_conform_sidekick.sh"
          cp installer/README.md "$pkg/INSTALL.txt"
          zip -r "$pkg.zip" "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
